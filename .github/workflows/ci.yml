name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Coalesce superseded pending pushes per branch without canceling an active main build.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTEST_FILE_MARKERS: '^import pytest|^ *HAVE_NUMPY ='

jobs:
  change-scope:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.paths.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check whether only documentation changed
        id: paths
        shell: pwsh
        run: |
          # A pull_request checkout is the test merge; its first parent is the PR base.
          # Treat missing history, an empty diff, and renames out of code conservatively.
          $PSNativeCommandUseErrorActionPreference = $false
          $docsOnly = $false
          git diff --quiet "$env:GITHUB_SHA^1" "$env:GITHUB_SHA" --
          if ($LASTEXITCODE -eq 1) {
            git diff --quiet --no-renames "$env:GITHUB_SHA^1" "$env:GITHUB_SHA" -- . `
              ':(exclude,top)README.md' ':(exclude,top)CONTRIBUTING.md' `
              ':(exclude,top)AGENTS.md' ':(exclude,top,glob)docs/**/*.md'
            $docsOnly = $LASTEXITCODE -eq 0
          }
          "docs-only=$($docsOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0 # GitHub's pwsh wrapper would otherwise forward git diff's status.
      # A docs-only diff still needs the tests that read those documents, because `check` is skipped for it: every
      # tests/test_docs_*.py (links, the design.md contract rows, list items, the repository paths a document
      # names) and the i18n index, which checks docs/i18n/README.md. All are standard library only and read only
      # tracked files. tests/test_ci_registration.py fails when a tests/test_docs_*.py is not run here.
      - name: Check documentation when only documentation changed
        if: steps.paths.outputs.docs-only == 'true'
        shell: bash
        run: |
          for t in tests/test_docs_*.py tests/test_i18n_index.py; do
            echo "== $t"
            python -I "$t" || exit 1
          done

  check:
    needs: change-scope
    if: ${{ !cancelled() && needs.change-scope.outputs.docs-only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Python tools compile
        run: python -m compileall -q make_game.py tools tests
      - name: make_game.py help
        run: python -I make_game.py --help
      - name: Tests (standard library only, no game data)
        shell: bash
        run: |
          # Run every file, then fail: stopping at the first failure would hide the files after it.
          failed=()
          while IFS= read -r t; do
            if grep -Eq "$PYTEST_FILE_MARKERS" "$t" || ! grep -q '__main__' "$t"; then
              continue
            fi
            echo "== $t"
            python -I "$t" || failed+=("$t")
          done < <(find tests -path 'tests/semantic' -prune -o -type f -name 'test_*.py' -print | LC_ALL=C sort)  # pytest-based files run in the translator-tests job
          if (( ${#failed[@]} )); then
            for t in "${failed[@]}"; do echo "::error file=$t::$t failed"; done
            exit 1
          fi
      - name: Build rpf9dump
        run: dotnet build tools/rpf9dump/rpf9dump.csproj -c Release
      - name: Test TTPF export retry
        env:
          RPF9DUMP_DLL: tools/rpf9dump/bin/Release/net8.0/rpf9dump.dll
        run: python -I tests/test_ttpf_export_resume.py
      # The standard-library loop above runs this file before rpf9dump is built, where it skips for lack of the DLL.
      - name: Test rpf9dump exit codes
        env:
          RPF9DUMP_DLL: tools/rpf9dump/bin/Release/net8.0/rpf9dump.dll
        run: python -I tests/test_rpf9dump_exit_codes.py
      - name: Build the calibrated BCPack reader and test the texture pipeline
        env:
          RPF9DUMP_DLL: tools/rpf9dump/bin/Release/net8.0/rpf9dump.dll
        shell: bash
        run: |
          python -m pip install -c tests/requirements.txt numpy
          CARGO_HOME="$(mktemp -d)" cargo build --release --locked --offline --manifest-path tools/bcpack_calibration/Cargo.toml
          python -I -c "import sys; sys.path.insert(0, 'tools'); import calibrated_texture; calibrated_texture.native()"
          python -I tests/test_calibrated_texture.py
          python -I tests/test_ttpf_assets.py
      - name: Test rpf9dump diagnostics
        run: dotnet run --project tests/Rpf9DumpDiagnostics/Rpf9DumpDiagnostics.csproj -c Release
  # DSTN's CI runs on Windows only. conda-forge's Windows LLVM has the AMDGPU target (LLVM's own Windows release does
  # not), and its SPIRV-Tools give spirv-as / spirv-val; the runner image ships Miniconda in CONDA.
  translator-tests:
    needs: change-scope
    if: ${{ !cancelled() && needs.change-scope.outputs.docs-only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tests/requirements.txt
      - name: Install llvm-mc and SPIRV-Tools (conda-forge)
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "dstn-tools"
          & (Join-Path $env:CONDA "Scripts\conda.exe") create --yes --quiet --prefix $prefix --override-channels -c conda-forge "llvm-tools>=21" spirv-tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bin = Join-Path $prefix "Library\bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "LLVM_MC=$(Join-Path $bin 'llvm-mc.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $version = & (Join-Path $bin "llvm-mc.exe") --version | Out-String
          $version
          if ($version -notmatch "amdgcn") { throw "conda-forge's llvm-mc has no AMDGPU target" }
          & (Join-Path $bin "spirv-val.exe") --version
          python -m pip install -r tests/requirements.txt
      - name: Translator tests
        shell: bash
        run: |
          pytest_files=()
          while IFS= read -r t; do
            if grep -Eq "$PYTEST_FILE_MARKERS" "$t" || ! grep -q '__main__' "$t"; then
              pytest_files+=("$t")
            elif [[ "$t" == tests/test_tex_headers.py ]]; then
              pytest_files+=("$t::TestTextureDescriptorParsing::test_stdlib_qword_scanner_edge_cases_and_parity")
            fi
          done < <(find tests -path 'tests/semantic' -prune -o -type f -name 'test_*.py' -print | LC_ALL=C sort)
          python -m pytest "${pytest_files[@]}" -q
      # The check job runs the standard-library loop before anything is installed, so the spirv-val checks
      # (test_split_big_switch, test_image_load_typed...) and the numpy paths skip there. This runs the same loop with
      # SPIRV-Tools and numpy installed, so those checks run somewhere.
      - name: Tests (standard-library loop with SPIRV-Tools and numpy)
        shell: bash
        run: |
          failed=()
          while IFS= read -r t; do
            if grep -Eq "$PYTEST_FILE_MARKERS" "$t" || ! grep -q '__main__' "$t"; then
              continue
            fi
            echo "== $t"
            python -I "$t" || failed+=("$t")
          done < <(find tests -path 'tests/semantic' -prune -o -type f -name 'test_*.py' -print | LC_ALL=C sort)
          if (( ${#failed[@]} )); then
            for t in "${failed[@]}"; do echo "::error file=$t::$t failed"; done
            exit 1
          fi

  semantic-tests:
    needs: change-scope
    if: ${{ !cancelled() && needs.change-scope.outputs.docs-only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Some semantic tests assemble and validate the translator's output with spirv-as / spirv-val and skip without
      # them (test_fma_khr, test_bary_fallback, test_image_coherent...). The runner image has neither, so a skip here
      # would read as a pass: this job installs SPIRV-Tools from conda-forge, and DSTN_REQUIRE_SPIRV_TOOLS=1 makes
      # tests/semantic/test_spirv_tools_required.py fail when they are missing, so those tests cannot go quiet.
      - name: Install SPIRV-Tools (conda-forge)
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "dstn-spirv"
          & (Join-Path $env:CONDA "Scripts\conda.exe") create --yes --quiet --prefix $prefix --override-channels -c conda-forge spirv-tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bin = Join-Path $prefix "Library\bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $bin "spirv-as.exe") --version
          & (Join-Path $bin "spirv-val.exe") --version
      - name: Translator semantic tests
        env:
          DSTN_REQUIRE_SPIRV_TOOLS: "1"
        run: python -I scripts/run_semantic_tests.py tests/semantic -v

  viewer-tests:
    needs: change-scope
    if: ${{ !cancelled() && needs.change-scope.outputs.docs-only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Viewer chunk streaming (synthetic, no browser or game data)
        shell: bash
        run: node --test tests/test_*.cjs
